# One-off: prepend the correction note to the GitHub release notes of v1.0.0 (original notes kept below it).
name: correct-release-notes-v1.0.0
on:
  push:
    branches: [release-v1.1.0-publisher]
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepend correction note to v1.0.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="$GITHUB_REPOSITORY"
          ID=$(gh api "repos/$R/releases/tags/v1.0.0" --jq .id)
          gh api "repos/$R/releases/$ID" --jq .body > old_body.md
          if grep -q "Correction (November 2026)" old_body.md; then echo "Already corrected; nothing to do."; exit 0; fi
          { cat .github/v1.0.0-correction-note.md; printf '\n---\n\n'; cat old_body.md; } > new_body.md
          gh api -X PATCH "repos/$R/releases/$ID" -F body=@new_body.md -f make_latest=false --jq '{html_url, draft, updated_at}'
          echo "Latest release is now: $(gh api "repos/$R/releases/latest" --jq .tag_name)"
